name: Validate userscript

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate and build userscript
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Upload installable userscript
        uses: actions/upload-artifact@v4
        with:
          name: daggerheart-su-companion-userscript
          path: dist/daggerheart-su-companion.user.js
          if-no-files-found: error
