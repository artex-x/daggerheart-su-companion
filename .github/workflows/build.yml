name: Validate and publish userscript

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: userscript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a version bump for userscript changes on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: ./scripts/assert-version-bump.ps1 -BaseSha '${{ github.event.before }}'

      - name: Validate and build userscript
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Upload installable userscript
        uses: actions/upload-artifact@v4
        with:
          name: daggerheart-su-companion-userscript
          path: dist/daggerheart-su-companion.user.js
          if-no-files-found: error

  verify-greasy-fork:
    name: Verify Greasy Fork synchronization
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wait for the GitHub webhook deployment
        shell: pwsh
        run: ./scripts/verify-greasy-fork-sync.ps1 -TimeoutSeconds 240 -PollIntervalSeconds 10
